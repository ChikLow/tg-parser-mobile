name: Build and publish to gh-pages

# Збирає застосунок і кладе готові файли в окрему гілку gh-pages.
# У Settings → Pages треба один раз обрати: Deploy from a branch → gh-pages → / (root).
# Так публікація працює з будь-якої робочої гілки, без обмежень середовища github-pages.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # сайт живе за адресою https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll          # хай Jekyll не чіпає зібрані файли
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Збірка з ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Підсумок
        run: |
          echo "### Готово ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Зібрано з гілки \`${{ github.ref_name }}\` і опубліковано в \`gh-pages\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Сайт: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Якщо сторінка порожня — перевір **Settings → Pages → Deploy from a branch → gh-pages → / (root)**." >> $GITHUB_STEP_SUMMARY
